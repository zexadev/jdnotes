name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Release body 取自手写的 changelog，不用 commit 自动生成——发布说明的措辞要和
      # 文档站、应用内 ChangelogModal 三处一致。取不到就直接失败：静默回退成「发布 vX.Y.Z」
      # 会让 Release 页和更新提示变成空壳，且失败发生在打包之后才发现，代价更大
      - name: Extract changelog
        shell: bash
        run: |
          # 按字段精确比对标题里的版本 token，不用正则匹配：版本号含点，正则下 . 会通配，
          # 且前缀匹配会让 v2.2.1 命中排在更前面的 ## v2.2.10 那一节。
          # 标题允许带后缀（如「## v2.0.0 — 多设备同步首发」），只比对 $2
          BODY=$(awk -v ver="$GITHUB_REF_NAME" '
            /^## / { if (found) exit; if ($2 == ver) found = 1; next }
            found { print }
          ' docs/src/content/changelog.mdx)
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            echo "::error::docs/src/content/changelog.mdx 里没有 '## ${GITHUB_REF_NAME}' 小节，或该节为空"
            exit 1
          fi
          printf '%s\n' "$BODY" > release_notes.md

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ''
          releaseDraft: false
          prerelease: false
          # 既有更新通道走 NSIS 的 setup.exe；默认值 false 会让 latest.json 改指 MSI，
          # 等于把所有老用户的更新包类型换掉
          updaterJsonPreferNsis: true

      - name: Update release body
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --notes-file release_notes.md

  # Android：在桌面 Release 建好之后跑，把签名 APK 挂上去，并在 latest.json 里补一段 android 条目
  # 供手机端应用内更新读取（桌面 updater 只读自己平台的 key，多出来的 android 条目它不认也不报错）。
  # 签名 keystore 只在 secrets 里（本地在 ~/.tauri/lapis-release.jks）；Android 只允许同签名覆盖安装，
  # 换 key 等于换应用，所有已装用户都得卸载重装
  android:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 ndk;27.0.12077973'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::仓库 secret $v 未设置，拒绝出未签名/错签名的 APK"; exit 1; }
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lapis-release.jks"
          cat > src-tauri/gen/android/keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/lapis-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS

      - name: Build signed APK
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
          CI: true
        run: pnpm tauri android build --apk --target aarch64

      - name: Upload APK and patch latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          VERSION="${TAG#v}"
          export APK_NAME="Lapis_${VERSION}_aarch64.apk"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$APK_NAME"
          gh release upload "$TAG" "$APK_NAME" --clobber
          gh release download "$TAG" -p latest.json -O latest.json
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            j.platforms = j.platforms || {};
            j.platforms["android-aarch64"] = {
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.TAG}/${process.env.APK_NAME}`,
              signature: "",
            };
            fs.writeFileSync("latest.json", JSON.stringify(j, null, 2));
          '
          gh release upload "$TAG" latest.json --clobber
        shell: bash

  # iOS：未签名 IPA 供自签，构建细节在 ios.yml。排在 android 之后串行，两者都要改 latest.json
  ios:
    needs: android
    uses: ./.github/workflows/ios.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
    permissions:
      contents: write

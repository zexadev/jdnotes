# iOS：在 macOS runner 上出「未签名 IPA」，用户用 AltStore / Sideloadly 等工具自签安装。
# 没有 Apple 开发者账号也没有 Mac，所以 Xcode 工程每次在 CI 现场 `tauri ios init` 生成（不入库）。
# 构建必须经 `tauri ios build`：Xcode 里的 Rust 构建脚本要连回 CLI 父进程拿参数，直接 xcodebuild 会
# 因为缺 <identifier>-server-addr 文件 panic。CLI 只有在设了 App Store Connect 三个 API 环境变量时才走
# 「archive 不签名 → 自签临时证书 → export」；我们塞假值让 archive 跑完，export 拿假凭据必然失败，
# 但 .xcarchive 里的 .app 已经在盘上，从那里打 IPA。
# 单独 workflow_dispatch 可随时试跑（产物挂 artifact）；发版时由 release.yml 以 workflow_call 调用并挂到 Release。
name: iOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '可选：挂到这个 Release（如 v2.3.0）；留空只上传 artifact'
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  ios:
    # 钉 macos-15（Xcode 16.4 默认）：macos-latest 已是 macOS 26 + Xcode 26.6，其 Swift 库搜索路径指向没装的
    # Metal toolchain cryptex 挂载点，swiftCompatibility56/Concurrency 找不到，链接直接报 undefined symbols
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tauri ios init 需要 xcodegen 生成 .xcodeproj；先装好，别让 CLI 在非交互环境里自己折腾 brew
      - name: Install xcodegen
        run: brew install xcodegen

      # 不签名，团队 ID 只是模板占位；rust targets 上面已装，跳过 CLI 的 rustup 安装
      - name: Generate Xcode project
        env:
          APPLE_DEVELOPMENT_TEAM: XXXXXXXXXX
        run: pnpm tauri ios init --ci --skip-targets-install

      # iOS 14+ 访问局域网必须声明用途与 Bonjour 服务名，否则连同网段的电脑都被系统拦下。
      # src-tauri/Info.ios.plist 里也有这两项，但实测 tauri ios init 不合并它（CLI 在 build 阶段才处理），
      # 这里按「没有才加」补进生成的 Info.plist，两边都在也不冲突；最终以 .app 里的 Info.plist 为准核对
      - name: Declare local network usage
        run: |
          set -euo pipefail
          plist=$(ls src-tauri/gen/apple/*_iOS/Info.plist | head -1)
          pb=/usr/libexec/PlistBuddy
          $pb -c "Print :NSLocalNetworkUsageDescription" "$plist" >/dev/null 2>&1 \
            || $pb -c "Add :NSLocalNetworkUsageDescription string '用于在同一局域网内与你的电脑直连同步笔记'" "$plist"
          $pb -c "Print :NSBonjourServices" "$plist" >/dev/null 2>&1 \
            || { $pb -c "Add :NSBonjourServices array" "$plist"; $pb -c "Add :NSBonjourServices:0 string '_lapis._tcp'" "$plist"; }
          $pb -c "Print :NSBonjourServices" "$plist"

      # 假的 App Store Connect 凭据只为触发 CLI 的 skip_codesign 分支（三个变量要么全设要么全不设，
      # 缺一个 CLI 直接报错）。archive 也会带 -authenticationKeyPath，xcodebuild 先本地解析 PEM，
      # 随便写个文件会报 invalidPEMDocument 连 archive 都不跑，所以生成一把真的 P-256 PKCS#8 私钥充数；
      # 不签名的 archive 用不到网络。archive 之后的 export 用假凭据必然失败，退出码不看，只认 .xcarchive 里的 .app
      - name: Archive via tauri ios build (export expected to fail)
        env:
          APPLE_DEVELOPMENT_TEAM: XXXXXXXXXX
          APPLE_API_KEY: DUMMY
          APPLE_API_ISSUER: 00000000-0000-0000-0000-000000000000
          APPLE_API_KEY_PATH: ${{ runner.temp }}/dummy.p8
          CI: true
        run: |
          set -u
          openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt -out "$APPLE_API_KEY_PATH"
          pnpm tauri ios build --export-method debugging --ci 2>&1 | tee ios_build.log
          status=${PIPESTATUS[0]}
          app=$(find src-tauri/gen/apple -type d -path '*.xcarchive/Products/Applications/*.app' | head -1)
          if [ -z "$app" ]; then
            echo "::error::archive 没产出 .app（tauri ios build 退出码 ${status}），见上方日志"
            exit 1
          fi
          echo "tauri ios build 退出码 ${status}（export 阶段没有真实 Apple 凭据，失败是预期的；archive 已完成）"
          /usr/libexec/PlistBuddy -c "Print :NSBonjourServices" "$app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Info.plist"
          echo "APP_PATH=$app" >> "$GITHUB_ENV"

      - name: Package IPA
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          IPA_NAME="Lapis_${VERSION}_ios_unsigned.ipa"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "$IPA_NAME" Payload
          ls -la "$IPA_NAME"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

      # 挂到 Release 并给 latest.json 补 ios-aarch64（url + 空 signature）。与 android job 串行跑，
      # 两个 job 同时改 latest.json 会互相覆盖
      - name: Upload IPA and patch latest.json
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          export IPA_NAME
          gh release upload "$TAG" "$IPA_NAME" --clobber
          gh release download "$TAG" -p latest.json -O latest.json
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            j.platforms = j.platforms || {};
            j.platforms["ios-aarch64"] = {
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.TAG}/${process.env.IPA_NAME}`,
              signature: "",
            };
            fs.writeFileSync("latest.json", JSON.stringify(j, null, 2));
          '
          gh release upload "$TAG" latest.json --clobber

[package]
name = "app"
version = "2.0.0"
description = "Lapis — a calm, local-first notes app"
authors = ["zexa (zexadev) <https://zexa.cc>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/zexadev/lapis"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
# MCP Server
rmcp = { version = "1", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1", features = ["net", "io-util", "sync"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
schemars = "1.0"
tauri-plugin-single-instance = "2.4.0"
urlencoding = "2.1.3"
reqwest = { version = "0.12", features = ["rustls-tls"] }
scraper = "0.26.0"
ego-tree = "0.11.0"
# P2P 跨网同步
iroh = "1.0.0"
# 三路文本合并（git 式 diff3）
diffy = "0.4"
# 图片附件：内容寻址（sha256）+ base64 编解码
sha2 = "0.10"
base64 = "0.22"
# 选真实局域网网卡 IP（避开 Docker/WSL 虚拟网卡），与 iroh 共用同版本
netdev = "0.44"
# 局域网设备自动发现：mDNS / DNS-SD 广播 + 浏览
mdns-sd = "0.13"
# 反远程调试注入：巡检 webview 子进程命令行（发布版封死 CDP 接管）
sysinfo = "0.32"

# 反远程调试注入：读注册表策略覆盖（发布版启动前拒绝）
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
